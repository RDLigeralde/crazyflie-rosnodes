# Controller
/*/controller:
  ros__parameters:
    crazyradio_driver:
      enable: False
      crazyflie_names:
        - crazy_jirl_b1
        - crazy_jirl_b2
      crazyradio_uris:
        - radio://0/80/2M/E7E7E701B1
        - radio://0/83/2M/E7E7E701B2
      ext_driver: py   # cpp or python
    gate_side: 1.0
    low_level_controller:
      c1: -0.6709
      c2: 0.1932
      c3: 13.0652
      thrust_pwm_min: 10001
      thrust_pwm_max: 60000
    policy:
      # path: /home/neo/workspace/logs/policies/2025-06-21_19-31-24/best_model.pt     # 35 laps
      # path: /home/neo/workspace/logs/policies/2025-06-30_13-59-12/best_model.pt     # 180 degree fixed yaw
      # path: /home/neo/workspace/logs/policies/2025-06-29_17-32-06/best_model.pt     # 90 degree fixed yaw (elliptical traj)
      # path: /home/neo/workspace/logs/policies/2025-06-30_14-02-19/best_model.pt     # 90 degree no roll and pitch restrictions
      # path: /home/neo/workspace/logs/policies/2025-06-30_18-05-01/best_model.pt     # 0 degree no roll and pitch restrictions
      # path: /home/neo/workspace/logs/policies/2025-06-18_15-28-43/model_3200_13022.pt # policy for Vineet's current multi-agent code for the fixed adversary
      # path: /home/neo/workspace/logs/policies/2025-07-17_15-59-05/best_model.pt     # yaw_des = pi, different perception reward computation
      # path: /home/neo/workspace/logs/policies/2025-07-17_16-04-28/best_model.pt     # yaw not fixed, just the new perception reward computation
      # path: /home/neo/workspace/logs/policies/2025-07-23_14-56-35/model_1700_19876.pt # increased yaw rate reward from -50 to -500 to discourage large yaw rates
      path: /home/neo/workspace/logs/policies/2025-07-23_17-48-08/best_model.pt     # increased yaw rate reward from -50 to -500 to discourage large yaw rates, domain randomization on tau_m motor coeffs


      max_pitch_br: 100.0
      max_roll_br: 100.0
      max_yaw_br: 200.0

      waypoints: [
         0.0, 3.0, 0.75, 0.0, 0.0,  0.0,
        -1.5, 4.5, 0.75, 0.0, 0.0, -1.57,
         0.0, 6.0, 1.75, 0.0, 0.0,  3.14,
         1.5, 4.5, 0.75, 0.0, 0.0,  1.57
      ]
      initial_waypoint: 0
    takeoff_height: 0.5

# Crazyradio driver
/crazyradio_driver:
  ros__parameters:
    crazyflie_names:
      - crazy_jirl_b1
      - crazy_jirl_b2
    crazyradio_uris:
      - radio://0/80/2M/E7E7E701B1
      - radio://0/83/2M/E7E7E701B2
    logger_period_ms: 1000
    reconnection_period_ms: 2000

# Vicon
/vicon_node:
  ros__parameters:
    server_address: mocap.perch
    frame_rate: 120
    max_accel: 10.0
    publish_tf: true
    publish_pts: false
    fixed_frame_id: mocap
    timer_single_pub_freq: 100
    timer_multi_pub_freq: 100
    model_list:
      - crazy_jirl_b1
      - crazy_jirl_b2
