# Controller
/*/controller:
  ros__parameters:
    crazyradio_driver:
      enable: False
      crazyflie_names:
        - crazy_jirl_b1
        - crazy_jirl_b2
      crazyradio_uris:
        - radio://0/80/2M/E7E7E701B1
        - radio://0/100/2M/E7E7E701B2
      ext_driver: py   # cpp or python
    gate_side: 1.0
    low_level_controller:
      c1: -0.6709
      c2: 0.1932
      c3: 13.0652
      thrust_pwm_min: 10001
      thrust_pwm_max: 60000
    policy:
      # path: /home/neo/workspace/logs/policies/2025-06-21_19-31-24/best_model.pt     # 35 laps
      # path: /home/neo/workspace/logs/policies/2025-06-30_13-59-12/best_model.pt     # 180 degree fixed yaw
      # path: /home/neo/workspace/logs/policies/2025-06-29_17-32-06/best_model.pt     # 90 degree fixed yaw (elliptical traj)
      # path: /home/neo/workspace/logs/policies/2025-06-30_14-02-19/best_model.pt     # 90 degree no roll and pitch restrictions
      # path: /home/neo/workspace/logs/policies/2025-06-30_18-05-01/best_model.pt     # 0 degree no roll and pitch restrictions
      # path: /home/neo/workspace/logs/policies/2025-06-18_15-28-43/model_3200_13022.pt # policy for Vineet's current multi-agent code for the fixed adversary
      # path: /home/neo/workspace/logs/policies/2025-07-17_15-59-05/best_model.pt     # yaw_des = pi, different perception reward computation
      # path: /home/neo/workspace/logs/policies/2025-07-17_16-04-28/best_model.pt     # yaw not fixed, just the new perception reward computation
      # path: /home/neo/workspace/logs/policies/2025-07-23_14-56-35/model_1700_19876.pt # increased yaw rate reward from -50 to -500 to discourage large yaw rates
      # path: /home/neo/workspace/logs/policies/2025-07-23_17-48-08/best_model.pt     # increased yaw rate reward from -50 to -500 to discourage large yaw rates, domain randomization on tau_m motor coeffs
      # path: /home/neo/workspace/logs/policies/2025-08-27_12-51-23/best_model.pt     # single agent from new merge_branch environment with new rewards (gate pass, no progress)
      path: /home/neo/workspace/logs/policies/2025-09-10_23-41-23/best_model.pt     # lemniscate dense single agent

      # jax_enable=True loads a mjc_dronetests checkpoint (path must then
      # point at that checkpoint's config.json, not a .pt file above) via
      # JaxRacingPolicy instead of the legacy PyTorch RacingPolicy — see
      # controller_node.py's init_controllers() and the crazyflow branch's
      # plan doc. Its action_type ("attitude" -> custom open-loop-mixer
      # controller, or "mellinger" -> onboard Mellinger controller) is read
      # from that config.json, not set here.
      jax_enable: False
      # action_type="mellinger" only: on-host desired-yaw -> yaw-rate
      # P-wrapper gain (1/s per radian of error) — needs on-hardware
      # tuning, start conservative. Unused for action_type="attitude" or
      # the legacy RacingPolicy.
      yaw_kp: 1.0

      max_pitch_br: 100.0
      max_roll_br: 100.0
      max_yaw_br: 200.0

      pass_gate_thr: 0.05

      # waypoints: [
      #    0.0, 3.0, 0.75, 0.0, 0.0,  0.0,
      #   -1.5, 4.5, 0.75, 0.0, 0.0, -1.57,
      #    0.0, 6.0, 1.75, 0.0, 0.0,  3.14,
      #    1.5, 4.5, 0.75, 0.0, 0.0,  1.57
      # ]

      waypoints: [
        1.5, 3.50, 0.75, 0.0, 0.0, -1.57,
        0.0, 5.25, 1.50, 0.0, 0.0,  0.00,
       -2.0, 7.00, 0.75, 0.0, 0.0, -1.57,
        1.5, 7.00, 0.75, 0.0, 0.0,  1.57,
        0.0, 5.25, 1.50, 0.0, 0.0,  0.00,
       -2.0, 3.50, 0.75, 0.0, 0.0,  1.57,
      ]

      initial_waypoint: 0
    takeoff_height: 0.5

    use_cond: False

# Crazyradio driver
/crazyradio_driver:
  ros__parameters:
    crazyflie_names:
      - crazy_jirl_b1
      - crazy_jirl_b2
    crazyradio_uris:
      - radio://0/80/2M/E7E7E701B1
      - radio://0/100/2M/E7E7E701B2
    logger_period_ms: 1000
    reconnection_period_ms: 2000
    # Sets stabilizer.controller=2 (Mellinger) at connect time — only for a
    # vehicle flashed with a STANDARD firmware build being flown with
    # policy.jax_enable + a "mellinger"-action_type checkpoint above. A
    # vehicle flashed with examples/app_race_policy (the custom
    # open-loop-mixer controller, for "attitude"-action_type checkpoints)
    # must NOT set this — see crazyradio_driver_params.py.
    mellinger_enable: False

# Vicon
/vicon_node:
  ros__parameters:
    server_address: 192.168.8.2  #mocap.perch
    frame_rate: 120
    max_accel: 10.0
    publish_tf: true
    publish_pts: false
    fixed_frame_id: mocap
    timer_single_pub_freq: 100
    timer_multi_pub_freq: 100
    model_list:
      - crazy_jirl_b1
      - crazy_jirl_b2
